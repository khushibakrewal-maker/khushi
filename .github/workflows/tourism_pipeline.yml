name: Tourism Project Pipeline

on:
  push:
    branches:
      - main

jobs:

  test-project:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas numpy==2.1.3 scikit-learn==1.6.1 joblib==1.6.0 dill huggingface_hub

      - name: Verify Hugging Face authentication
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "from huggingface_hub import whoami; print(whoami(token='$HF_TOKEN'))"

      - name: Verify application file
        run: |
          test -f app.py
          test -f requirements.txt
          echo "Application files verified successfully."

      - name: Pipeline completed
        run: |
          echo "Tourism Project MLOps pipeline completed successfully!"
