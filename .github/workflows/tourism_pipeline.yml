name: Tourism Project Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ==========================================
  # 1. REGISTER DATASET
  # ==========================================

  register-dataset:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas huggingface_hub

      - name: Register Dataset on Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python pipeline/register_dataset.py


  # ==========================================
  # 2. DATA PREPARATION
  # ==========================================

  data-prep:

    needs: register-dataset

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn huggingface_hub

      - name: Run Data Preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python pipeline/data_prep.py

      - name: Upload prepared data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: artifacts/


  # ==========================================
  # 3. MODEL TRAINING
  # ==========================================

   model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

            - name: Download prepared data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download

          hf_hub_download(
              repo_id="Khushibk/tourism-dataset",
              filename="train.csv",
              repo_type="dataset",
              local_dir="data",
              token="${HF_TOKEN}"
          )

          hf_hub_download(
              repo_id="Khushibk/tourism-dataset",
              filename="test.csv",
              repo_type="dataset",
              local_dir="data",
              token="${HF_TOKEN}"
          )
          PY

      - name: Run Model Training
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          python pipeline/model_training.py

  # ==========================================
  # 4. DEPLOYMENT VERIFICATION
  # ==========================================

  deploy-hosting:

    needs:
      - register-dataset
      - data-prep
      - model-training

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Streamlit application
        run: |
          test -f app.py
          echo "Streamlit application found."

      - name: Verify requirements
        run: |
          test -f requirements.txt
          echo "Requirements file found."

      - name: Deployment completed
        run: |
          echo "Tourism Product Prediction deployment pipeline completed."
          echo "Streamlit application is deployed from the main branch."
